<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Web Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #1a1a2e;
            --bg-secondary: #16213e;
            --accent: #e94560;
            --accent-hover: #d63450;
            --border: #0f3460;
            --text: #eeeeee;
            --text-muted: #888888;
            --success: #4ade80;
            --warning: #fbbf24;
            --error: #f87171;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; 
            background: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            overflow: hidden;
        }
        .sidebar { 
            width: 280px; 
            background: var(--bg-secondary); 
            border-right: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
        }
        .sidebar-header { 
            padding: 20px; 
            border-bottom: 1px solid var(--border); 
        }
        .sidebar-title { 
            font-size: 1.2rem; 
            font-weight: bold; 
            color: var(--accent); 
        }
        .session-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px; 
        }
        .session-item { 
            padding: 12px; 
            background: var(--bg); 
            border-radius: 8px; 
            margin-bottom: 8px; 
            cursor: pointer; 
            transition: all 0.2s; 
            border: 1px solid transparent; 
        }
        .session-item:hover { 
            background: var(--border); 
            border-color: var(--accent); 
        }
        .session-item.active { 
            background: var(--border); 
            border-color: var(--accent); 
        }
        .session-name { 
            font-weight: bold; 
            color: var(--accent); 
            margin-bottom: 4px; 
        }
        .session-meta { 
            font-size: 0.75rem; 
            color: var(--text-muted); 
        }
        .new-session-btn { 
            width: 100%; 
            background: var(--border); 
            border: 1px solid var(--accent); 
            color: var(--accent); 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 10px; 
            font-family: inherit;
        }
        .new-session-btn:hover { 
            background: var(--accent); 
            color: var(--text); 
        }
        .main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: var(--bg); 
        }
        .header { 
            padding: 15px 20px; 
            background: var(--bg-secondary); 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .model-selector { 
            background: var(--border); 
            border: 1px solid var(--accent); 
            color: var(--text); 
            padding: 8px 16px; 
            border-radius: 6px; 
            font-family: inherit;
        }
        .chat-area { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }
        .message { 
            max-width: 80%; 
            padding: 12px 16px; 
            border-radius: 12px; 
            animation: fadeIn 0.3s; 
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .message.user { 
            background: var(--border); 
            align-self: flex-end; 
            border-bottom-right-radius: 4px; 
        }
        .message.assistant { 
            background: var(--bg-secondary); 
            align-self: flex-start; 
            border-bottom-left-radius: 4px; 
        }
        .message.tool { 
            background: var(--accent); 
            align-self: flex-start; 
            border-bottom-left-radius: 4px; 
            color: var(--bg); 
            font-family: monospace; 
            font-size: 0.85rem; 
        }
        .message.system { 
            background: var(--accent); 
            color: var(--bg); 
            font-size: 0.85rem; 
            text-align: center; 
            align-self: center; 
            max-width: 60%; 
        }
        .message-header { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 8px; 
            font-size: 0.75rem; 
            color: var(--text-muted); 
        }
        .message-content { 
            white-space: pre-wrap; 
            word-wrap: break-word; 
        }
        .input-area { 
            padding: 20px; 
            background: var(--bg-secondary); 
            border-top: 1px solid var(--border); 
        }
        .input-wrapper { 
            display: flex; 
            gap: 12px; 
            max-width: 900px; 
            margin: 0 auto; 
        }
        .input-field { 
            flex: 1; 
            background: var(--bg); 
            border: 1px solid var(--border); 
            color: var(--text); 
            padding: 12px 16px; 
            border-radius: 8px; 
            font-family: inherit; 
            font-size: 1rem; 
            resize: none; 
            min-height: 60px; 
            max-height: 200px; 
        }
        .input-field:focus { 
            outline: none; 
            border-color: var(--accent); 
        }
        .send-btn { 
            background: var(--accent); 
            color: var(--text); 
            border: none; 
            padding: 12px 24px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            align-self: flex-end; 
        }
        .send-btn:hover { 
            background: #d63450; 
        }
        .status-bar { 
            display: flex; 
            gap: 20px; 
            font-size: 0.8rem; 
            color: var(--text-muted); 
        }
        .status-item { 
            display: flex; 
            gap: 6px; 
            align-items: center; 
        }
        .dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
        }
        .dot.connected { 
            background: var(--success); 
        }
        .dot.disconnected { 
            background: var(--error); 
        }
        .new-session-btn { 
            width: 100%; 
            background: var(--border); 
            border: 1px solid var(--accent); 
            color: var(--accent); 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 10px; 
        }
        .new-session-btn:hover { 
            background: var(--accent); 
            color: var(--text); 
        }
        .tasks-panel { 
            width: 300px; 
            background: var(--bg-secondary); 
            border-left: 1px solid var(--border); 
            padding: 20px; 
            overflow-y: auto; 
        }
        .task-item { 
            background: var(--bg); 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            border: 1px solid transparent; 
        }
        .task-item.running { 
            border-color: var(--warning); 
        }
        .task-item.completed { 
            border-color: var(--success); 
        }
        .task-item.failed { 
            border-color: var(--error); 
        }
        .task-header { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 8px; 
        }
        .task-prompt { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .status-badge { 
            font-size: 0.7rem; 
            padding: 2px 8px; 
            border-radius: 12px; 
            font-weight: bold; 
        }
        .status-pending { 
            background: var(--bg); 
            color: var(--warning); 
        }
        .status-running { 
            background: var(--bg); 
            color: var(--warning); 
        }
        .status-completed { 
            background: var(--bg); 
            color: var(--success); 
        }
        .status-failed { 
            background: var(--bg); 
            color: var(--error); 
        }
        .local-agent-panel { 
            width: 300px; 
            background: var(--bg-secondary); 
            border-left: 1px solid var(--border); 
            padding: 20px; 
        }
        .command-input { 
            background: var(--bg); 
            border: 1px solid var(--border); 
            color: var(--text); 
            padding: 10px; 
            border-radius: 6px; 
            width: 100%; 
            font-family: monospace; 
            margin-bottom: 10px; 
        }
        .command-output { 
            background: var(--bg); 
            border: 1px solid var(--border); 
            color: var(--success); 
            padding: 12px; 
            border-radius: 6px; 
            font-family: monospace; 
            font-size: 0.8rem; 
            max-height: 300px; 
            overflow-y: auto; 
            white-space: pre-wrap; 
        }
        pre { 
            background: var(--bg); 
            padding: 8px; 
            border-radius: 4px; 
            overflow-x: auto; 
        }
        code { 
            background: var(--bg); 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-family: monospace; 
            font-size: 0.9em; 
        }
        .code-block { 
            background: var(--bg); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 16px; 
            margin: 8px 0; 
            overflow-x: auto; 
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">🤖 Hermes</div>
        </div>
        <div class="session-list">
            <button class="new-session-btn" onclick="createSession()">+ New Session</button>
            <div id="sessions"></div>
        </div>
    </div>
    <div class="main">
        <div class="header">
            <div>
                <select class="model-selector" id="modelSelector">
                    <option value="free-router">🆓 Free Router (Auto)</option>
                    <option value="nvidia/nemotron-3-ultra">⚡ Nemotron 3 Ultra</option>
                    <option value="deepseek/deepseek-v3">🧠 DeepSeek V3</option>
                    <option value="upstage/solar-pro">☀️ Solar Pro</option>
                    <option value="zhipu/glm-5.2">🌟 GLM 5.2</option>
                    <option value="local">🏠 Local Model</option>
                </select>
            </div>
            <div class="status-bar">
                <div class="status-item"><span class="dot connected" id="localAgentDot"></span><span>Local Agent</span></div>
                <div class="status-item"><span class="dot connected"></span><span>WebSocket</span></div>
            </div>
        </div>
        <div class="chat-area" id="chatArea"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <textarea class="input-field" id="inputField" placeholder="Type your message... (Enter to send, Shift+Enter for newline)" rows="2"></textarea>
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    <div class="tasks-panel">
        <h3 style="color: var(--accent); margin-bottom: 16px;">🤖 Agent Tasks</h3>
        <div id="tasksList"></div>
    </div>
    <div class="local-agent-panel">
        <h3 style="color: var(--accent); margin-bottom: 16px;">🖥️ Local Agent</h3>
        <input class="command-input" id="cmdInput" placeholder="shell command..." onkeypress="if(event.key==='Enter') runCommand()">
        <button onclick="runCommand()" style="width: 100%; background: var(--accent); border: none; color: var(--text); padding: 10px; border-radius: 6px; cursor: pointer;">Run Command</button>
        <div class="command-output" id="cmdOutput">Ready...</div>
    </div>

    <script>
        let currentSession = null;
        let ws = null;
        
        function connectWS() {
            ws = new WebSocket(`ws://${location.host}/ws`);
            ws.onopen = () => {
                document.getElementById('localAgentDot').className = 'dot connected';
                if (currentSession) ws.send(JSON.stringify({type: 'subscribe', session_id: currentSession}));
            };
            ws.onclose = () => {
                document.getElementById('localAgentDot').className = 'dot disconnected';
                setTimeout(connectWS, 3000);
            };
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'message' && msg.session_id === currentSession) {
                    addMessage(msg.message);
                } else if (msg.type === 'task_update') {
                    updateTask(msg.task);
                }
            };
        }
        
        function addMessage(msg) {
            const area = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = `message ${msg.role}`;
            const time = new Date(msg.timestamp).toLocaleTimeString();
            div.innerHTML = `
                <div class="message-header">
                    <span>${msg.role}</span>
                    <span>${time}</span>
                </div>
                <div class="message-content">${escapeHtml(msg.content)}</div>
            `;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/\n/g, '<br>');
        }
        
        async function createSession() {
            const res = await fetch('/api/sessions', {method: 'POST'});
            const data = await res.json();
            selectSession(data.session_id);
        }
        
        async function loadSessions() {
            const res = await fetch('/api/sessions');
            const sessions = await res.json();
            const container = document.getElementById('sessions');
            container.innerHTML = '';
            sessions.forEach(s => {
                const div = document.createElement('div');
                div.className = 'session-item' + (s.id === currentSession ? ' active' : '');
                div.onclick = () => selectSession(s.id);
                div.innerHTML = `
                    <div class="session-name">${s.id}</div>
                    <div class="session-meta">${s.message_count} messages · ${s.model}</div>
                `;
                container.appendChild(div);
            });
        }
        
        function selectSession(id) {
            currentSession = id;
            document.querySelectorAll('.session-item').forEach(el => el.classList.toggle('active', el.onclick.toString().includes(id)));
            loadSession(id);
            if (ws && ws.readyState === 1) ws.send(JSON.stringify({type: 'subscribe', session_id: id}));
        }
        
        async function loadSession(id) {
            const res = await fetch(`/api/sessions/${id}`);
            const session = await res.json();
            const area = document.getElementById('chatArea');
            area.innerHTML = '';
            session.messages.forEach(addMessage);
        }
        
        async function sendMessage() {
            const input = document.getElementById('inputField');
            const text = input.value.trim();
            if (!text || !currentSession) return;
            
            input.value = '';
            
            await fetch(`/api/sessions/${currentSession}/chat`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: text})
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/\n/g, '<br>');
        }
        
        async function runCommand() {
            const input = document.getElementById('cmdInput');
            const cmd = input.value.trim();
            if (!cmd) return;
            
            const output = document.getElementById('cmdOutput');
            output.textContent = `$ ${cmd}\nRunning...`;
            input.value = '';
            
            try {
                const res = await fetch('/api/local/command', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({command: cmd})
                });
                const data = await res.json();
                output.textContent = `$ ${cmd}\n${data.stdout || ''}${data.stderr ? '\n' + data.stderr : ''}\nExit: ${data.returncode}`;
            } catch (e) {
                output.textContent = `Error: ${e}`;
            }
        }
        
        async function loadTasks() {
            const res = await fetch('/api/agent/tasks');
            const tasks = await res.json();
            const container = document.getElementById('tasksList');
            container.innerHTML = '';
            tasks.forEach(t => {
                const div = document.createElement('div');
                div.className = `task-item ${t.status}`;
                div.innerHTML = `
                    <div class="task-header">
                        <span>${t.id}</span>
                        <span class="status-badge status-${t.status}">${t.status.toUpperCase()}</span>
                    </div>
                    <div class="task-prompt">${t.prompt.substring(0, 60)}...</div>
                `;
                container.appendChild(div);
            });
        }
        
        // Init
        document.getElementById('inputField').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        connectWS();
        loadSessions();
        loadTasks();
        setInterval(loadTasks, 5000);
        
        // Check local agent
        fetch('/api/local/health').then(r => r.json()).then(d => {
            document.getElementById('localAgentDot').className = 'dot ' + (d.healthy ? 'connected' : 'disconnected');
        });
    </script>
</body>
</html>
