#!/usr/bin/env bash
# swarm_products.cfg — TEMPLATE for the product-aware ENI swarm floor.
# Copy to ~/Desktop/Commander/eni_swarm/swarm_products.cfg and edit.
# Array index = X11 workspace index (0..3). Keys MUST be SHORT + NON-PREFIXING
# (DEM must not be a prefix of D3D, etc. — builder_ws() matches by prefix).
#
# Builder names become <KEY><i> (e.g. SB1, D3D1, DEM1, LUM1); each writes
# /home/hunter/STATUS_<KEY><i>.md. gen_run_scripts.sh generates all run/status/
# master/heartbeat/launch scripts from this file.

PRODUCT_KEYS=(   SB    D3D    DEM    LUM   )
PRODUCT_LABEL=(  "STOCK BOT" "DEMIURGE 3D" "DEMIURGE" "LUMEN" )
PRODUCT_WS=(     0     1       2       3    )

# repos — two products may share a tree (different substreams)
PRODUCT_REPO=( \
  /home/hunter/Commander/demiurge_scaffold \
  /home/hunter/Desktop/demiurge-3d \
  /home/hunter/Commander/demiurge_scaffold \
  /home/hunter/Desktop/apps/lumen )

# one-line brief baked into each builder's task file
PRODUCT_BRIEF=( \
  "Equities/stock trading bot: build feature modules, run validate_gate, harden the deploy-gate, ship." \
  "3D-print manager: build the PyQt GUI + slicing + printer-fleet control, package the AppImage, ship." \
  "Forex/FTMO trading bot: build feature modules, harden the purged-CV + walk-forward deploy-gate, ship." \
  "WebGL live-wallpaper engine: build the PyQt6 GUI, AppImage/Flatpak packaging, Steam store assets, ship." )

# OpenRouter spine; qwen3-coder for code-heavy builds
PRODUCT_MODEL=( \
  "tencent/hy3:free" "qwen/qwen3-coder:free" "tencent/hy3:free" "qwen/qwen3-coder:free" )

# builders PER product (kept low for memory-tight box; raise if RAM allows)
# total booted = sum = 12 here (safe; OOM was at 64)
PRODUCT_BUILDERS=( 3 3 3 3 )

# live status file each workspace's BOOT/monitor terminal tails
PRODUCT_STATUS=( \
  /home/hunter/Commander/demiurge_scaffold/STATUS_PL_STOCKBOT.md \
  /home/hunter/Desktop/demiurge-3d/STATUS_DEMIURGE3D_PL.md \
  /home/hunter/Commander/demiurge_scaffold/STATUS_PL_DEMIURGE.md \
  /home/hunter/Desktop/apps/lumen/STATUS_LUMEN_PL.md )

# OPTIONAL real boot command (run inside the BOOT terminal, in the repo).
# Leave "" to just monitor (safe). Uncomment to actually launch the app:
#   LUM: "bash -c 'source .venv/bin/activate; python -m lumen &'"
PRODUCT_RUN=( "" "" "" "" )
