# ~/.config/pipewire/pipewire.conf.d/99-signal-combined.conf
# Combined sink: outputs to physical device (Volt 2) + null sink (signal-sink)
# Monitor source: signal-sink.monitor (select in Signal/Discord/OBS as input)

context.modules = [
  { name = libpipewire-module-null-sink
    args = {
      sink_name = signal-sink
      sink_properties = {
        "node.name" = "signal-sink"
        "node.description" = "Signal Virtual Sink"
        "media.class" = "Audio/Sink"
        "channel-positions" = "[ FL FR ]"
      }
    }
  }

  { name = libpipewire-module-combine-stream
    args = {
      combine.name = combined-sink
      combine.properties = {
        "node.name" = "combined-sink"
        "node.description" = "Combined: Volt 2 + Signal"
        "media.class" = "Audio/Sink"
      }
      combine.streams = [
        { name = "Volt 2 Output" node.name = "alsa_output.usb-Universal_Audio_Volt_2-00.analog-stereo" }
        { name = "Signal Sink" node.name = "signal-sink" }
      ]
    }
  }
]

# Apply: systemctl --user restart pipewire pipewire-pulse wireplumber
# Verify: pactl list short sinks | grep -E 'signal-sink|combined-sink'
#         pactl list short sources | grep monitor