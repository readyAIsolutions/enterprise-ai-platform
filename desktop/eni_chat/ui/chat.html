<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ENI Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"></div>
    <select id="model" class="model" title="model">
      <option value="auto">auto</option>
    </select>
    <span class="endpoint" id="endpoint"></span>
    <span class="status" id="status" title="online">●</span>
  </header>
  <main id="log" class="log"></main>
  <form id="form" class="composer">
    <textarea id="input" rows="1" placeholder="Message…  (Enter to send, Shift+Enter newline)"></textarea>
    <button type="submit" id="btn">Send</button>
  </form>
  <script src="/app.js"></script>
</body>
</html>
