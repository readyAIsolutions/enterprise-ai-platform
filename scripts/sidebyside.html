<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ENI × Hermes — Side-by-Side</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--muted:#8b949e;
        --green:#3fb950;--red:#f85149;--amber:#d29922;--blue:#58a6ff;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,monospace;background:var(--bg);color:var(--fg)}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:16px;margin:0;letter-spacing:.5px}
  .pills{display:flex;gap:8px;margin-left:8px}
  .pill{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.up{color:var(--green);border-color:var(--green)}
  .pill.down{color:var(--red);border-color:var(--red)}
  .tabs{display:flex;gap:4px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tab{cursor:pointer;padding:7px 16px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:13px}
  .tab:hover{color:var(--fg)}
  .tab.active{background:#1f2633;color:var(--fg);border-color:var(--line)}
  .frame-wrap{position:relative;height:calc(100vh - 112px)}
  iframe{width:100%;height:100%;border:0}
  .go{margin-left:auto;display:flex;gap:10px;font-size:12px;color:var(--muted)}
  a{color:var(--blue);text-decoration:none}
  .note{font-size:11px;color:var(--amber);margin-left:6px}
</style>
</head>
<body>
<header>
  <h1>ENI <span style="color:var(--blue)">×</span> Hermes — Side-by-Side Build</h1>
  <div class="pills">
    <span class="pill" id="pill-hermes">Hermes …</span>
    <span class="pill" id="pill-eni">ENI …</span>
    <span class="pill" id="pill-mp">Multiplayer …</span>
    <span class="pill" id="pill-ctrl">Controller …</span>
  </div>
  <div class="go"><a href="#" id="open-eni">ENI</a> · <a href="#" id="open-hermes">Hermes</a> · <a href="#" id="open-mp">board</a></div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="eni">ENI Platform</button>
  <button class="tab" data-tab="hermes">Hermes</button>
  <button class="tab" data-tab="mp">Multiplayer Board</button>
  <button class="tab" data-tab="ctrl">One-Prompt API</button>
</div>

<div class="frame-wrap" id="wrap-eni"><iframe id="f-eni"></iframe></div>
<div class="frame-wrap" id="wrap-hermes" style="display:none"><iframe id="f-hermes" class="hf"></iframe></div>
<div class="frame-wrap" id="wrap-mp" style="display:none"><iframe id="f-mp" class="hf"></iframe></div>
<div class="frame-wrap" id="wrap-ctrl" style="display:none"><iframe id="f-ctrl" class="hf"></iframe></div>

<script>
const MAP={eni:'wrap-eni',hermes:'wrap-hermes',mp:'wrap-mp',ctrl:'wrap-ctrl'};
const SRC={eni:'http://127.0.0.1:8421',hermes:'http://127.0.0.1:8765/docs',mp:'http://127.0.0.1:8788/api/board',ctrl:'http://127.0.0.1:8913/health'};
// default hermes src depends on live mode
function setSrcs(status){
  const hp = status && status.hermes ? status.hermes.port : 8765;
  if(hp===9119){SRC.hermes='http://127.0.0.1:9119';document.querySelector('#pill-hermes').textContent='Hermes (dash)';}
  else {SRC.hermes='http://127.0.0.1:8765/docs';}
  for(const k in SRC){document.getElementById('f-'+k).src=SRC[k];}
}
function setPill(id,up,label){const e=document.getElementById('pill-'+id);e.textContent=(up?'● ':'○ ')+label;e.className='pill '+(up?'up':'down');}
async function poll(){
  try{
    const r=await fetch('/api/status',{cache:'no-store'});
    const s=await r.json();
    setPill('hermes',s.hermes.up,'Hermes');
    setPill('eni',s.eni_dashboard.up,'ENI');
    setPill('mp',s.multiplayer.up,'Multiplayer');
    setPill('ctrl',s.controller.up,'Controller');
    return s;
  }catch(e){setPill('hermes',false,'Hermes');setPill('eni',false,'ENI');setPill('mp',false,'Multiplayer');setPill('ctrl',false,'Controller');}
}
// first load: get status so hermes src + pills are right
(async()=>{const s=await poll();setSrcs(s);})();
setInterval(poll,3000);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  for(const k in MAP){document.getElementById(MAP[k]).style.display=(k===b.dataset.tab)?'':'none';}
});
document.getElementById('open-eni').href='http://127.0.0.1:8421';
document.getElementById('open-hermes').href='http://127.0.0.1:8765/docs';
document.getElementById('open-mp').href='http://127.0.0.1:8788/api/board';
</script>
</body>
</html>
