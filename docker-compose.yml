# =============================================================================
# ENI Enterprise — Hermes Portable Layer (SLICE C)
# -----------------------------------------------------------------------------
# A small, focused compose that stands up the portable Hermes layer plus the
# platform kernel so a company can self-host in one command:
#   docker compose -f docker-compose.yml up -d
#
# The full 14+ service platform compose continues to live at docker/docker-
# compose.yml (reuse that one for the whole stack). This file vendors the
# skills/LSP/MCP/plugin pack from this repo into a disposable Hermes home and
# attaches the platform kernel image as a companion service.
# =============================================================================
version: "3.9"

services:
  # -- Hermes portable layer (skills/LSP/MCP/plugin pack) --------------------
  hermes-layer:
    image: python:3.12-slim
    container_name: eni-hermes-layer
    restart: unless-stopped
    working_dir: /workspace
    environment:
      HERMES_HOME: /hermes
      ENI_CONFIG: /workspace/config
    volumes:
      # read-only source of truth
      - ./:/workspace:ro
      # writable Hermes home seeded from the pack by the installer
      - hermes_home:/hermes
    entrypoint: >
      /bin/sh -c
      "bash /workspace/scripts/install_skillspack.sh --target=/hermes &&
       exec python3 /workspace/scripts/eni_cli doctor"
    profiles: ["hermes"]   # opt-in: not started by default platform `up`

  # -- companion: platform kernel (ephemeral doctor) ------------------------
  platform-kernel:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: eni-platform-kernel
    restart: unless-stopped
    working_dir: /app
    environment:
      ENI_CONFIG: /app/config
    volumes:
      - ./modules:/app/modules:ro
      - ./foundation:/app/foundation:ro
      - ./kernel:/app/kernel:ro
    command: python3 -m kernel

  # -- dev variant of the platform kernel -----------------------------------
  platform-kernel-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: eni-platform-kernel-dev
    restart: unless-stopped
    working_dir: /app
    command: python3 -m kernel
    profiles: ["dev"]

volumes:
  hermes_home: