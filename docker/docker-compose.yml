# =============================================================================
# ENI Enterprise Platform — Docker Compose Orchestration
# 14+ Services: api-gateway, dashboard, eni-swarm, claude-code-server,
# swarm-turbocharger, free-router, event-hub, service-mesh,
# 10 enterprise modules, redis, postgres, monitoring stack
# =============================================================================

version: "3.9"

# ── Shared anchors ───────────────────────────────────────────────────────────
x-common-build: &common-build
  context: ..            # Build context is enterprise/ root
  dockerfile: docker/Dockerfile

x-common-dev-build: &common-dev-build
  context: ..
  dockerfile: docker/Dockerfile.dev

x-common-env: &common-env
  ENI_ENV: production
  LOG_LEVEL: INFO
  TZ: UTC
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

x-deploy-standard: &deploy-standard
  resources:
    limits:
      cpus: "2"
      memory: 512M
    reservations:
      cpus: "0.5"
      memory: 256M

x-deploy-heavy: &deploy-heavy
  resources:
    limits:
      cpus: "4"
      memory: 1024M
    reservations:
      cpus: "1"
      memory: 512M

x-deploy-light: &deploy-light
  resources:
    limits:
      cpus: "1"
      memory: 256M
    reservations:
      cpus: "0.25"
      memory: 128M

x-deploy-micro: &deploy-micro
  resources:
    limits:
      cpus: "0.5"
      memory: 128M
    reservations:
      cpus: "0.1"
      memory: 64M

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ──────────────────────────────────────────────────────────────────────────
  # Core Platform Infrastructure
  # ──────────────────────────────────────────────────────────────────────────

  # ── Platform Kernel ──────────────────────────────────────────────────────
  kernel:
    build: *common-build
    container_name: eni-kernel
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "8000"
      SERVICE_NAME: kernel
      MODULE_REGISTRY_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      DB_URL: postgresql+asyncpg://eni:eni@postgres:5432/eni_enterprise
    ports:
      - "${KERNEL_PORT:-8000}:8000"
    volumes:
      - kernel_data:/app/data
      - ./kernel:/app/kernel:ro
      - ./foundation:/app/foundation:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
    deploy: *deploy-standard
    networks:
      - eni-internal
    command: ["python", "-m", "kernel"]

  # ── API Gateway ──────────────────────────────────────────────────────────
  api-gateway:
    build: *common-build
    container_name: eni-api-gateway
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "8421"
      SERVICE_NAME: api-gateway
      KERNEL_URL: http://kernel:8000
      ALLOWED_ORIGINS: "*"
      RATE_LIMIT_PER_MINUTE: "300"
    ports:
      - "${GATEWAY_PORT:-8421}:8421"
    volumes:
      - ./integration:/app/integration:ro
    depends_on:
      kernel:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8421/health"]
    deploy: *deploy-standard
    networks:
      - eni-internal
    command: ["python", "-m", "integration.api_gateway"]

  # ── Dashboard ────────────────────────────────────────────────────────────
  dashboard:
    build: *common-build
    container_name: eni-dashboard
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "8421"
      SERVICE_NAME: dashboard
      KERNEL_URL: http://kernel:8000
      GATEWAY_URL: http://api-gateway:8421
      DASHBOARD_REFRESH_SEC: "10"
    ports:
      - "${DASHBOARD_PORT:-8421}:8421"
    volumes:
      - ./dashboard:/app/dashboard:ro
      - dashboard_static:/app/dashboard/static
    depends_on:
      kernel:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8421/health"]
    deploy: *deploy-standard
    networks:
      - eni-internal
    command: ["python", "-m", "dashboard.server"]

  # ── Event Hub ────────────────────────────────────────────────────────────
  event-hub:
    build: *common-build
    container_name: eni-event-hub
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "8900"
      SERVICE_NAME: event-hub
      KERNEL_URL: http://kernel:8000
      REDIS_URL: redis://redis:6379/1
    ports:
      - "${EVENT_HUB_PORT:-8900}:8900"
    volumes:
      - ./integration:/app/integration:ro
    depends_on:
      kernel:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8900/health"]
    deploy: *deploy-standard
    networks:
      - eni-internal
    command: ["python", "-m", "integration.event_hub"]

  # ── Service Mesh ─────────────────────────────────────────────────────────
  service-mesh:
    build: *common-build
    container_name: eni-service-mesh
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "8910"
      SERVICE_NAME: service-mesh
      KERNEL_URL: http://kernel:8000
      DISCOVERY_INTERVAL_SEC: "15"
      CIRCUIT_BREAKER_THRESHOLD: "5"
    ports:
      - "${SERVICE_MESH_PORT:-8910}:8910"
    volumes:
      - ./integration:/app/integration:ro
    depends_on:
      kernel:
        condition: service_healthy
      event-hub:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8910/health"]
    deploy: *deploy-standard
    networks:
      - eni-internal
    command: ["python", "-m", "integration.service_mesh"]

  # ──────────────────────────────────────────────────────────────────────────
  # ENI Swarm Ecosystem
  # ──────────────────────────────────────────────────────────────────────────

  # ── ENI Swarm Core ───────────────────────────────────────────────────────
  eni-swarm:
    build: *common-build
    container_name: eni-swarm-core
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "8420"
      SERVICE_NAME: eni-swarm
      KERNEL_URL: http://kernel:8000
      SWARM_ROOT: /app/ENI_Swarm_NEW
      SWARM_CONFIG_PATH: /app/swarm_config
      ENI_SWARM_WORKERS: "6"
      ENI_SWARM_SPAWN_INTERVAL: "30"
    ports:
      - "${ENI_SWARM_PORT:-8420}:8420"
    volumes:
      - ./modules/swarm_bridge:/app/modules/swarm_bridge:ro
      - swarm_data:/app/swarm_data
    depends_on:
      kernel:
        condition: service_healthy
      event-hub:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8420/health"]
    deploy: *deploy-heavy
    networks:
      - eni-internal
    command: ["python", "-m", "modules.swarm_bridge"]

  # ── Swarm Turbocharger ───────────────────────────────────────────────────
  swarm-turbocharger:
    build: *common-build
    container_name: eni-swarm-turbocharger
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "8922"
      SERVICE_NAME: swarm-turbocharger
      KERNEL_URL: http://kernel:8000
      ENI_SWARM_URL: http://eni-swarm:8420
      TURBO_MODE: "true"
      MAX_CONNECTIONS: "80"
      CONNECTION_POOL_SIZE: "20"
    ports:
      - "${TURBOCHARGER_PORT:-8922}:8922"
    volumes:
      - ./modules/swarm_network:/app/modules/swarm_network:ro
    depends_on:
      eni-swarm:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8922/health"]
    deploy: *deploy-standard
    networks:
      - eni-internal
    command: ["python", "-m", "modules.swarm_network"]

  # ── Free Router ──────────────────────────────────────────────────────────
  free-router:
    build: *common-build
    container_name: eni-free-router
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "8920"
      SERVICE_NAME: free-router
      KERNEL_URL: http://kernel:8000
      TURBOCHARGER_URL: http://swarm-turbocharger:8922
      ENI_SWARM_URL: http://eni-swarm:8420
      ROUTING_STRATEGY: least_connections
      BACKEND_TIMEOUT_SEC: "30"
    ports:
      - "${FREE_ROUTER_PORT:-8920}:8920"
    volumes:
      - ./modules/swarm_network:/app/modules/swarm_network:ro
    depends_on:
      swarm-turbocharger:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8920/health"]
    deploy: *deploy-standard
    networks:
      - eni-internal
    command: ["python", "-m", "modules.free_router"]

  # ──────────────────────────────────────────────────────────────────────────
  # Claude Code Infrastructure
  # ──────────────────────────────────────────────────────────────────────────

  # ── Claude Code Server ───────────────────────────────────────────────────
  claude-code-server:
    build: *common-build
    container_name: eni-claude-code-server
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "9120"
      SERVICE_NAME: claude-code-server
      KERNEL_URL: http://kernel:8000
      SESSION_TIMEOUT_SEC: "3600"
      MAX_SESSIONS: "50"
      ENABLE_WEBSOCKET: "true"
    ports:
      - "${CLAUDE_CODE_PORT:-9120}:9120"
    volumes:
      - ./modules/agent_infra:/app/modules/agent_infra:ro
      - ./modules/agent_core:/app/modules/agent_core:ro
      - ./modules/agent_tools:/app/modules/agent_tools:ro
      - claude_code_sessions:/app/sessions
    depends_on:
      kernel:
        condition: service_healthy
      event-hub:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:9120/health"]
    deploy: *deploy-heavy
    networks:
      - eni-internal
    command: ["python", "-m", "modules.agent_infra.server"]

  # ──────────────────────────────────────────────────────────────────────────
  # Enterprise Modules (10 services)
  # ──────────────────────────────────────────────────────────────────────────

  # ── Knowledge Graph ──────────────────────────────────────────────────────
  module-knowledge-graph:
    build: *common-build
    container_name: eni-module-knowledge-graph
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: knowledge-graph
      KERNEL_URL: http://kernel:8000
    volumes:
      - ./modules/knowledge_graph:/app/modules/knowledge_graph:ro
    depends_on:
      kernel:
        condition: service_healthy
    deploy: *deploy-standard
    networks:
      - eni-internal
    command: ["python", "-m", "modules.knowledge_graph"]

  # ── Privacy & Data Governance ────────────────────────────────────────────
  module-privacy-data:
    build: *common-build
    container_name: eni-module-privacy-data
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: privacy-data
      KERNEL_URL: http://kernel:8000
    volumes:
      - ./modules/privacy_data:/app/modules/privacy_data:ro
    depends_on:
      kernel:
        condition: service_healthy
    deploy: *deploy-light
    networks:
      - eni-internal
    command: ["python", "-m", "modules.privacy_data"]

  # ── Safety & Governance ──────────────────────────────────────────────────
  module-safety-governance:
    build: *common-build
    container_name: eni-module-safety-governance
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: safety-governance
      KERNEL_URL: http://kernel:8000
    volumes:
      - ./modules/safety_governance:/app/modules/safety_governance:ro
    depends_on:
      kernel:
        condition: service_healthy
    deploy: *deploy-light
    networks:
      - eni-internal
    command: ["python", "-m", "modules.safety_governance"]

  # ── Prompt & Context Management ──────────────────────────────────────────
  module-prompt-context:
    build: *common-build
    container_name: eni-module-prompt-context
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: prompt-context
      KERNEL_URL: http://kernel:8000
    volumes:
      - ./modules/prompt_context:/app/modules/prompt_context:ro
    depends_on:
      kernel:
        condition: service_healthy
    deploy: *deploy-light
    networks:
      - eni-internal
    command: ["python", "-m", "modules.prompt_context"]

  # ── Release & Change Management ──────────────────────────────────────────
  module-release-change:
    build: *common-build
    container_name: eni-module-release-change
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: release-change
      KERNEL_URL: http://kernel:8000
    volumes:
      - ./modules/release_change:/app/modules/release_change:ro
    depends_on:
      kernel:
        condition: service_healthy
    deploy: *deploy-light
    networks:
      - eni-internal
    command: ["python", "-m", "modules.release_change"]

  # ── Agent Coordination ───────────────────────────────────────────────────
  module-agent-coordination:
    build: *common-build
    container_name: eni-module-agent-coordination
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: agent-coordination
      KERNEL_URL: http://kernel:8000
    volumes:
      - ./modules/agent_coordination:/app/modules/agent_coordination:ro
    depends_on:
      kernel:
        condition: service_healthy
    deploy: *deploy-standard
    networks:
      - eni-internal
    command: ["python", "-m", "modules.agent_coordination"]

  # ── Customer Experience ──────────────────────────────────────────────────
  module-customer-experience:
    build: *common-build
    container_name: eni-module-customer-experience
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: customer-experience
      KERNEL_URL: http://kernel:8000
    volumes:
      - ./modules/customer_experience:/app/modules/customer_experience:ro
    depends_on:
      kernel:
        condition: service_healthy
    deploy: *deploy-light
    networks:
      - eni-internal
    command: ["python", "-m", "modules.customer_experience"]

  # ── Developer Experience ─────────────────────────────────────────────────
  module-developer-experience:
    build: *common-build
    container_name: eni-module-developer-experience
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: developer-experience
      KERNEL_URL: http://kernel:8000
    volumes:
      - ./modules/developer_experience:/app/modules/developer_experience:ro
    depends_on:
      kernel:
        condition: service_healthy
    deploy: *deploy-light
    networks:
      - eni-internal
    command: ["python", "-m", "modules.developer_experience"]

  # ── Innovation & R&D ─────────────────────────────────────────────────────
  module-innovation-rd:
    build: *common-build
    container_name: eni-module-innovation-rd
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: innovation-rd
      KERNEL_URL: http://kernel:8000
    volumes:
      - ./modules/innovation_rd:/app/modules/innovation_rd:ro
    depends_on:
      kernel:
        condition: service_healthy
    deploy: *deploy-light
    networks:
      - eni-internal
    command: ["python", "-m", "modules.innovation_rd"]

  # ── Disaster Recovery ────────────────────────────────────────────────────
  module-disaster-recovery:
    build: *common-build
    container_name: eni-module-disaster-recovery
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: disaster-recovery
      KERNEL_URL: http://kernel:8000
    volumes:
      - ./modules/disaster_recovery:/app/modules/disaster_recovery:ro
    depends_on:
      kernel:
        condition: service_healthy
    deploy: *deploy-light
    networks:
      - eni-internal
    command: ["python", "-m", "modules.disaster_recovery"]

  # ── Research & Verification ──────────────────────────────────────────────
  module-research-verification:
    build: *common-build
    container_name: eni-module-research-verification
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: research-verification
      KERNEL_URL: http://kernel:8000
    volumes:
      - ./modules/research_verification:/app/modules/research_verification:ro
    depends_on:
      kernel:
        condition: service_healthy
    deploy: *deploy-standard
    networks:
      - eni-internal
    command: ["python", "-m", "modules.research_verification"]

  # ── Enterprise Validation ────────────────────────────────────────────────
  module-enterprise-validation:
    build: *common-build
    container_name: eni-module-enterprise-validation
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: enterprise-validation
      KERNEL_URL: http://kernel:8000
    volumes:
      - ./modules/enterprise_validation:/app/modules/enterprise_validation:ro
    depends_on:
      kernel:
        condition: service_healthy
    deploy: *deploy-light
    networks:
      - eni-internal
    command: ["python", "-m", "modules.enterprise_validation"]

  # ── ENI Compression ──────────────────────────────────────────────────────
  module-eni-compression:
    build: *common-build
    container_name: eni-module-eni-compression
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: eni-compression
      KERNEL_URL: http://kernel:8000
    volumes:
      - ./modules/compression_bridge:/app/modules/compression_bridge:ro
    depends_on:
      kernel:
        condition: service_healthy
    deploy: *deploy-light
    networks:
      - eni-internal
    command: ["python", "-m", "modules.compression_bridge"]

  # ── ENI Knowledge Base ───────────────────────────────────────────────────
  module-eni-kb:
    build: *common-build
    container_name: eni-module-eni-kb
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: eni-kb
      KERNEL_URL: http://kernel:8000
    volumes:
      - ./modules/kb_bridge:/app/modules/kb_bridge:ro
    depends_on:
      kernel:
        condition: service_healthy
    deploy: *deploy-light
    networks:
      - eni-internal
    command: ["python", "-m", "modules.kb_bridge"]

  # ──────────────────────────────────────────────────────────────────────────
  # Infrastructure Services
  # ──────────────────────────────────────────────────────────────────────────

  # ── Redis (Cache & Message Broker) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eni-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy: *deploy-micro
    networks:
      - eni-internal

  # ── PostgreSQL (Primary Database) ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: eni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eni_secure_2024}
      POSTGRES_DB: eni_enterprise
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "eni", "-d", "eni_enterprise"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - eni-internal

  # ── Prometheus (Metrics) ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: eni-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy: *deploy-micro
    networks:
      - eni-internal

  # ── Grafana (Dashboards) ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: eni-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy: *deploy-light
    networks:
      - eni-internal

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  eni-internal:
    driver: bridge
    name: eni-internal
  eni-public:
    driver: bridge
    name: eni-public

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  kernel_data:
    name: eni-kernel-data
  swarm_data:
    name: eni-swarm-data
  dashboard_static:
    name: eni-dashboard-static
  claude_code_sessions:
    name: eni-claude-code-sessions
  redis_data:
    name: eni-redis-data
  postgres_data:
    name: eni-postgres-data
  prometheus_data:
    name: eni-prometheus-data
  grafana_data:
    name: eni-grafana-data